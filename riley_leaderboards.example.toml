[server]
host = "0.0.0.0"
port = 8082
cors_origins = ["https://rileyleff.com", "https://*.rileyleff.com"]
behind_proxy = false
# sse_enabled = false                   # enable SSE streaming endpoint
# sse_max_connections = 1000            # max concurrent SSE connections per server
# sse_score_debounce_ms = 1000          # min interval between score.updated events per board
# sse_timeout_secs = 1800               # SSE connection timeout (0 = no timeout, default 30 min)
# sse_broadcast_buffer = 256            # broadcast channel buffer size per board

[database]
url = "env:DATABASE_URL"               # postgres://user:pass@host/db
max_connections = 10
# schema = "leaderboards"              # optional, defaults to "public"

# [redis]
# url = "env:REDIS_URL"                # redis://host:6379
# key_prefix = "rl"                    # prefix for all Redis keys (default: "rl")

# [limits]
# max_entries_per_version = 10000      # max placements per version (default: 10000)
# max_versions_per_board = 1000        # max versions per board (default: 1000)
# max_metadata_size_bytes = 1048576    # max metadata JSON size in bytes (default: 1MB)

# [auth]
# # JWT mode (with riley_auth or any JWKS-compatible issuer):
# jwks_url = "https://auth.rileyleff.com/.well-known/jwks.json"
# required_role = "admin"
#
# # API token mode (standalone, mutually exclusive with jwks_url):
# admin_token = "env:LEADERBOARDS_ADMIN_TOKEN"
# # Legacy alias (mutually exclusive with admin_token):
# # api_token = "env:LEADERBOARDS_API_TOKEN"
#
# # Read-only tokens (work with either JWT or API token mode):
# read_tokens = ["env:LEADERBOARDS_READ_TOKEN"]
# require_read_auth = false  # when true, reads also require a valid token

# [sync]
# repo_path = "/var/lib/leaderboards/boards"   # local checkout of boards repo
# webhook_secret = "env:WEBHOOK_SECRET"        # GitHub webhook HMAC secret
# sync_branch = "main"                         # only sync pushes to this branch (default: "main")

# Outbound webhooks — fire-and-forget notifications on board/version events.
# Events: version.created, board.created, board.updated, board.deleted
#
# [[webhooks]]
# url = "https://api.netlify.com/build_hooks/abc123"
# events = ["version.created"]
# boards = ["dc-*"]                            # optional glob filter (empty = all boards)
#
# [[webhooks]]
# url = "https://discord.com/api/webhooks/xyz"
# events = ["version.created", "board.created"]
# secret = "env:OUTBOUND_WEBHOOK_SECRET"       # optional HMAC-SHA256 signing
