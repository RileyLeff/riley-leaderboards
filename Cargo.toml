[workspace]
resolver = "3"
members = [
    "crates/riley-leaderboards-core",
    "crates/riley-leaderboards-api",
    "crates/riley-leaderboards-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["serde", "v4"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP (for testing)
http = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Crypto (for webhook HMAC-SHA256 verification)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Auth (JWT validation, JWKS fetching)
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Redis (for realtime boards)
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

# Streaming / SSE
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
pin-project-lite = "0.2"

# Rate limiting
tower_governor = "0.6"

# CORS
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Temp files (for testing)
tempfile = "3"

# Internal crates
riley-leaderboards-core = { path = "crates/riley-leaderboards-core" }
riley-leaderboards-api = { path = "crates/riley-leaderboards-api" }
