# Development / test infrastructure for riley_leaderboards
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: riley_leaderboards
      POSTGRES_PASSWORD: riley_leaderboards_test
      POSTGRES_DB: riley_leaderboards_test
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riley_leaderboards -d riley_leaderboards_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

